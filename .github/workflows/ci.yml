name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Valida os gabaritos das lições de Python (script autocontido, sem dependências)
  gabaritos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verificar gabaritos das lições
        run: python3 scripts/verify_lessons.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --no-frozen-lockfile

      # O tsconfig inclui .next/types/**, mas em checkout limpo o .next não existe,
      # então o tsc não varre artefatos de build aqui.
      - name: Typecheck
        run: pnpm exec tsc --noEmit

  # continue-on-error: os envs abaixo são dummies e podem quebrar o prerender de
  # páginas que consultam o Supabase em build time. Este job é um sinal antecipado;
  # a validação definitiva de build é o deploy da Vercel (com envs reais).
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --no-frozen-lockfile

      - name: Build (envs dummy)
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy
          SUPABASE_SERVICE_ROLE_KEY: dummy
          SUPABASE_SECRET_KEY: dummy

  # Informativo até zerarmos os avisos do codebase — depois vira bloqueante.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
