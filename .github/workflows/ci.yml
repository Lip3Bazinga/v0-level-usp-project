name: CI/CD

# Integração contínua: roda em todo PR e em push para develop/main.
# Entrega contínua (job "publicar"): só em push, depois que TODOS os jobs passam.
#   develop → imagens :homolog   (o notebook atualiza a homologação sozinho)
#   main    → imagens :prod      (exige aprovação no environment "production")
# As máquinas de destino PUXAM as imagens do GHCR (levelusp.ps1 update / tarefa
# agendada) — nenhuma porta do notebook fica aberta para o GitHub.
# Obs.: o CD fica neste arquivo (e não num workflow_run separado) porque
# workflow_run só dispara a partir do arquivo presente na branch padrão.
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PYTHON_WASI_DIR: /opt/levelusp-python
  TEST_DATABASE_URL: postgres://levelusp:levelusp@localhost:5432/levelusp_test

jobs:
  qualidade:
    name: Lint, tipos, testes unitários e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build (contracts → db → api/runner/web)
        run: pnpm build
        env: { API_INTERNAL_URL: "http://api:4000" }
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Testes unitários (api, runner, web, contracts)
        run: pnpm test
        env: { SKIP_SANDBOX_TESTS: "1" }

  api-e2e:
    name: API e2e (PostgreSQL real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: levelusp, POSTGRES_PASSWORD: levelusp, POSTGRES_DB: levelusp_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U levelusp" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @levelusp/contracts build && pnpm --filter @levelusp/db build
      - run: pnpm --filter @levelusp/api test:e2e

  seguranca:
    name: Suíte de ataques (API, cadeia de suprimentos e bundle da web)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: levelusp, POSTGRES_PASSWORD: levelusp, POSTGRES_DB: levelusp_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U levelusp" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @levelusp/contracts build && pnpm --filter @levelusp/db build
      - name: Ataques à API (autorização, BOLA, mass assignment, injeção, sessão, lógica de negócio)
        run: pnpm --filter @levelusp/api test:security
      - name: Regras das verificações (unitários do pacote de segurança)
        run: pnpm --filter @levelusp/security test
      - name: Cadeia de suprimentos (pacotes alucinados, typosquatting, lockfile, pnpm audit)
        run: pnpm security:deps
      - name: Segredos e source maps no bundle da web (build com canários)
        run: pnpm security:web-bundle
        env: { API_INTERNAL_URL: "http://api:4000" }

  sandbox:
    name: Executor WASI (segurança, gabaritos e paridade com o navegador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Cache do CPython WASI
        uses: actions/cache@v4
        with:
          path: /opt/levelusp-python
          key: python-wasi-${{ hashFiles('apps/runner/scripts/fetch-python-wasi.sh') }}
      - name: Wasmtime + CPython WASI (SHA-256 verificado)
        run: sudo -E env "PATH=$PATH" bash apps/runner/scripts/fetch-python-wasi.sh && sudo chown -R "$USER" /opt/levelusp-python
      - run: pnpm --filter @levelusp/contracts build && pnpm --filter @levelusp/runner build
      - name: Testes do executor (inclui ataques da auditoria)
        run: pnpm --filter @levelusp/runner test
      - name: Catálogo de ataques ao executor (fuga, recursos, modo estrito, unittest)
        run: pnpm --filter @levelusp/runner test:attacks
      - name: Sobe o executor
        run: |
          node apps/runner/dist/main.js > "$GITHUB_WORKSPACE/runner.log" 2>&1 &
          npx --yes wait-on@8 -t 30000 tcp:127.0.0.1:8081
        env: { RUNNER_TOKEN: ci-runner-token-0123456789abcdef }
      - name: Gabaritos do seed (solução aprova, esqueleto reprova)
        run: pnpm --filter @levelusp/api verify:seed
        env: { RUNNER_TOKEN: ci-runner-token-0123456789abcdef }
      - name: Forja de veredito contra o executor real (todas as lições)
        run: pnpm --filter @levelusp/api test:attacks
        env: { RUNNER_TOKEN: ci-runner-token-0123456789abcdef }
      - name: Paridade Executar × Verificar (Pyodide 314 × CPython WASI)
        run: pnpm --filter @levelusp/web test:paridade
        env: { RUNNER_TOKEN: ci-runner-token-0123456789abcdef, PARITY_REPORT: "${{ github.workspace }}/paridade-python.md" }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: paridade-python, path: paridade-python.md, if-no-files-found: ignore, retention-days: 7 }
      - if: failure()
        run: tail -n 100 runner.log

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    needs: [qualidade]
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: levelusp, POSTGRES_PASSWORD: levelusp, POSTGRES_DB: levelusp }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U levelusp" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://levelusp:levelusp@localhost:5432/levelusp
      RUNNER_TOKEN: ci-runner-token-0123456789abcdef
      SEED_ADMIN_EMAIL: admin@levelusp.dev
      SEED_ADMIN_PASSWORD: ci-admin-password-123
      SEED_DEMO_USERS: "true"
      E2E_ADMIN_PASSWORD: ci-admin-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: /opt/levelusp-python
          key: python-wasi-${{ hashFiles('apps/runner/scripts/fetch-python-wasi.sh') }}
      - run: sudo -E env "PATH=$PATH" bash apps/runner/scripts/fetch-python-wasi.sh && sudo chown -R "$USER" /opt/levelusp-python
      - run: pnpm build
        env: { API_INTERNAL_URL: "http://localhost:4000" }
      - name: Banco (migrações + seed de homologação)
        run: pnpm db:migrate && pnpm db:seed
      - name: Sobe executor, API e front
        run: |
          node apps/runner/dist/main.js > "$GITHUB_WORKSPACE/runner.log" 2>&1 &
          (cd apps/api && APP_ENV=test AUTH_THROTTLE_LIMIT=500 RUNNER_URL=http://localhost:8081 node dist/main.js > "$GITHUB_WORKSPACE/api.log" 2>&1 &)
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/
          cp -r apps/web/public apps/web/.next/standalone/apps/web/
          (cd apps/web/.next/standalone/apps/web && PORT=3000 node server.js > "$GITHUB_WORKSPACE/web.log" 2>&1 &)
          npx --yes wait-on@8 -t 60000 http://localhost:3000 http://localhost:4000/api/health/ready
      - run: pnpm --filter @levelusp/web exec playwright install --with-deps chromium
      - run: pnpm --filter @levelusp/web test:e2e
      - if: failure()
        run: tail -n 100 runner.log api.log web.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }

  docker:
    name: Imagens Docker (build de validação)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix: { service: [api, runner, web] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  publicar:
    name: Publicar imagens (CD)
    runs-on: ubuntu-latest
    needs: [qualidade, seguranca, api-e2e, sandbox, e2e]
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: { service: [api, runner, web] }
    steps:
      - uses: actions/checkout@v4
      - name: Tags
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          env_tag="${{ github.ref_name == 'main' && 'prod' || 'homolog' }}"
          sha="$(echo '${{ github.sha }}' | cut -c1-7)"
          image="ghcr.io/${owner}/levelusp/${{ matrix.service }}"
          echo "tags=${image}:${env_tag},${image}:sha-${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${env_tag}-${sha}" >> "$GITHUB_OUTPUT"
          echo "app_env=${env_tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            NEXT_PUBLIC_APP_ENV=${{ steps.meta.outputs.app_env }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
