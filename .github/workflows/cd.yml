name: CD

# Entrega contínua: depois que o CI passa num push,
#   develop → imagens :homolog   (o notebook atualiza a homologação sozinho)
#   main    → imagens :prod      (exige aprovação no environment "production")
# As máquinas de destino PUXAM as imagens do GHCR (levelusp.ps1 update / tarefa
# agendada) — nenhuma porta do notebook fica aberta para o GitHub.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, main]

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'homolog' }}
    strategy:
      matrix: { service: [api, runner, web] }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha }}" }
      - name: Tags
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          env_tag="${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'homolog' }}"
          sha="$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)"
          image="ghcr.io/${owner}/levelusp/${{ matrix.service }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:${env_tag},${image}:sha-${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${env_tag}-${sha}" >> "$GITHUB_OUTPUT"
          echo "app_env=${env_tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            NEXT_PUBLIC_APP_ENV=${{ steps.meta.outputs.app_env }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
