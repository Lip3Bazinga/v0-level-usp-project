- enunciado: |
    O que o programa abaixo imprime?

    ```python
    def dividir(a, b):
        try:
            return a / b
        except ZeroDivisionError:
            return "erro"
        finally:
            print("fim")

    print(dividir(1, 0))
    ```
  opcoes:
  - "`erro` e, na linha seguinte, `fim`"
  - "Só `erro`: o `return` sai antes do `finally`"
  - "Só `fim`"
  - "`fim` e, na linha seguinte, `erro`"
  correta: 3
  explicacao: "O `return \"erro\"` prepara o valor, mas o `finally` roda antes de a função terminar e imprime `fim`. Só depois o `print` de fora mostra o valor devolvido."
  topico: excecoes-e-robustez
- enunciado: |
    O que o programa abaixo imprime?

    ```python
    def ler(config):
        try:
            valor = int(config["porta"])
        except KeyError:
            print("faltou")
        except ValueError:
            print("inválido")
        else:
            print("ok", valor)

    ler({"porta": "80a"})
    ler({})
    ```
  opcoes:
  - "`inválido` e, na linha seguinte, `faltou`"
  - "`faltou` e, na linha seguinte, `inválido`"
  - "`inválido`, `ok 80` e `faltou`"
  - "`ok 80a` e `faltou`"
  correta: 0
  explicacao: "`int(\"80a\")` levanta `ValueError`; no dicionário vazio, a chave falta e o erro é `KeyError`. O `else` só roda quando o `try` termina sem exceção."
  topico: excecoes-e-robustez
- enunciado: |
    O que o programa abaixo imprime?

    ```python
    class Sessao:
        def __enter__(self):
            print("abre")
            return self

        def __exit__(self, tipo, valor, tb):
            print("fecha")
            return False

    try:
        with Sessao():
            print("usa")
            raise ValueError("x")
    except ValueError:
        print("tratado")
    ```
  opcoes:
  - "`abre`, `usa`, `tratado`"
  - "`abre`, `usa`, `fecha`, `tratado`"
  - "`abre`, `usa`, `tratado`, `fecha`"
  - "`abre`, `usa`, `fecha`"
  correta: 1
  explicacao: "O `__exit__` roda assim que o bloco do `with` termina, mesmo por exceção. Como devolve `False`, a exceção continua subindo e é tratada pelo `except` de fora."
  topico: excecoes-e-robustez
