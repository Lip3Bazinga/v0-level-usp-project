titulo: Prova do Nível 2 — Python intermediário e engenharia de software
descricao: "Banco de 40 questões (10 sorteadas por tentativa) sobre orientação a objetos, módulos, exceções, arquivos, iteradores, geradores, decoradores, tipagem, testes e git, na proporção das lições de cada módulo. A maioria pede para ler código: prever a saída, achar o erro ou escolher a construção certa. Nota mínima: 70 %."
nota_minima: 70
tempo_min: 45
intervalo_min: 60
questoes_por_tentativa: 10
questoes:
- enunciado: |
    O que o programa abaixo imprime?

    ```python
    class Base:
        def __init__(self):
            print("base")

    class Filha(Base):
        def __init__(self):
            print("filha")
            super().__init__()

    Filha()
    ```
  opcoes:
  - "`filha` e, na linha seguinte, `base`"
  - "`base` e, na linha seguinte, `filha`"
  - "Só `filha`: o `__init__` da filha substitui o da base"
  - "Só `base`: o Python roda apenas o construtor da classe base"
  correta: 0
  explicacao: "O `__init__` de `Filha` roda primeiro e imprime `filha`; a chamada `super().__init__()` executa então o da base. Sem essa chamada, `base` não seria impresso."
  topico: programacao-orientada-a-objetos
- enunciado: |
    O que o programa abaixo imprime?

    ```python
    class Retangulo:
        def __init__(self, largura, altura):
            self.largura = largura
            self.altura = altura

        @property
        def area(self):
            return self.largura * self.altura

    r = Retangulo(2, 3)
    r.largura = 5
    print(r.area)
    ```
  opcoes:
  - "Algo como `<bound method Retangulo.area ...>`"
  - "`15`"
  - "`6`"
  - "`AttributeError`, porque `area` não tem setter"
  correta: 1
  explicacao: "A property é calculada a cada leitura, com os valores atuais: 5 × 3 = 15. Ler `r.area` não exige parênteses nem setter."
  topico: programacao-orientada-a-objetos
- enunciado: |
    O que o programa abaixo imprime?

    ```python
    class Pedido:
        total = 0

        def __init__(self):
            Pedido.total += 1
            self.numero = Pedido.total

    a = Pedido()
    b = Pedido()
    print(a.numero, b.numero, Pedido.total)
    ```
  opcoes:
  - "`1 1 2`"
  - "`1 2 0`"
  - "`1 2 2`"
  - "`2 2 2`"
  correta: 2
  explicacao: "`total` é atributo da classe, dividido por todos os pedidos; cada `__init__` o incrementa e guarda o valor daquele momento em `self.numero`, que é de cada objeto."
  topico: programacao-orientada-a-objetos
- enunciado: |
    O que o programa abaixo imprime?

    ```python
    class Nota:
        def __init__(self, valor):
            self.valor = valor

        def __str__(self):
            return f"nota {self.valor}"

        def __repr__(self):
            return f"Nota({self.valor})"

    print(f"{Nota(7)} e {[Nota(8)]}")
    ```
  opcoes:
  - "`Nota(7) e [Nota(8)]`"
  - "`nota 7 e [nota 8]`"
  - "`nota 7 e ['nota 8']`"
  - "`nota 7 e [Nota(8)]`"
  correta: 3
  explicacao: "A f-string usa o `__str__` do objeto; a lista, ao virar texto, mostra cada item com o `__repr__`."
  topico: programacao-orientada-a-objetos
- enunciado: "A classe `Forma` define `area()`, e toda subclasse precisa implementá-lo. Qual construção faz o erro aparecer já ao **criar** um objeto de uma subclasse que esqueceu `area`?"
  opcoes:
  - "`Forma` herdar de `ABC` e marcar `area` com `@abstractmethod`"
  - "Escrever em `Forma.area` um `raise NotImplementedError`"
  - "Testar `isinstance(forma, Forma)` antes de cada chamada a `area`"
  - "Escrever na docstring de `Forma` que as subclasses devem implementar `area`"
  correta: 0
  explicacao: "Com `ABC` e `@abstractmethod`, instanciar uma subclasse incompleta levanta `TypeError` na hora. O `raise NotImplementedError` só falha quando alguém chama `area()`, talvez muito depois."
  topico: programacao-orientada-a-objetos
- enunciado: |
    O que acontece na última linha?

    ```python
    from dataclasses import dataclass

    @dataclass(frozen=True)
    class Ponto:
        x: int
        y: int

    p = Ponto(1, 2)
    p.x = 5
    ```
  opcoes:
  - "Nada: `frozen` só impede a criação de atributos novos"
  - "Levanta `FrozenInstanceError` (uma subclasse de `AttributeError`): o objeto não pode ser alterado"
  - "`p` passa a ser `Ponto(x=5, y=2)`"
  - "O Python cria um `Ponto` novo e o atribui a `p`"
  correta: 1
  explicacao: "Com `frozen=True`, a dataclass gera um `__setattr__` que recusa qualquer atribuição depois da criação. Para \"mudar\" um ponto congelado, crie outro, por exemplo com `dataclasses.replace`."
  topico: programacao-orientada-a-objetos
- enunciado: |
    O que o programa abaixo imprime?

    ```python
    class Turma:
        def __init__(self, alunos):
            self.alunos = alunos

        def __len__(self):
            return len(self.alunos)

    t = Turma(["Ana", "Bia"])
    print(len(t), bool(t), bool(Turma([])))
    ```
  opcoes:
  - "`2 False False`"
  - "`TypeError`, porque `bool` exige o método `__bool__`"
  - "`2 True False`"
  - "`2 True True`"
  correta: 2
  explicacao: "`len` chama `__len__`. Sem `__bool__`, o Python usa o `__len__` para decidir a verdade do objeto: tamanho zero é falso."
  topico: programacao-orientada-a-objetos
- enunciado: |
    O que o programa abaixo imprime?

    ```python
    class Conta:
        def taxa(self):
            return 2

    class ContaPremium(Conta):
        def taxa(self):
            return super().taxa() / 2

    contas = [Conta(), ContaPremium(), Conta()]
    print(sum(c.taxa() for c in contas))
    ```
  opcoes:
  - "`5`"
  - "`6`"
  - "`3.0`"
  - "`5.0`"
  correta: 3
  explicacao: "Cada objeto responde com o próprio `taxa`: 2, 2 / 2 = 1.0 e 2. A divisão com `/` sempre dá `float`, e a soma de `int` com `float` também."
  topico: programacao-orientada-a-objetos
- enunciado: |
    O que acontece ao executar a última linha?

    ```python
    class Produto:
        def __init__(self, preco):
            self.preco = preco

        @property
        def preco(self):
            return self._preco

        @preco.setter
        def preco(self, valor):
            if valor < 0:
                raise ValueError("preço negativo")
            self._preco = valor

    p = Produto(-5)
    ```
  opcoes:
  - "Levanta `ValueError`: a atribuição `self.preco = preco` do `__init__` passa pelo setter"
  - "Cria o produto com preço -5, porque a validação só vale para atribuições depois da criação"
  - "Levanta `AttributeError`, porque `_preco` ainda não existe"
  - "Cria o produto com preço 0, porque o setter corrige o valor"
  correta: 0
  explicacao: "Dentro do `__init__`, `self.preco = ...` é uma atribuição à property como qualquer outra: o setter roda e recusa o valor. Assim a regra vale desde a criação."
  topico: programacao-orientada-a-objetos
- enunciado: |
    O arquivo `utilidades.py` tem, na primeira linha, `print("carregando")` e define a função `limpar`. Quantas vezes `carregando` aparece ao rodar o `main.py` abaixo?

    ```python
    import utilidades
    import utilidades
    from utilidades import limpar
    ```
  opcoes:
  - "Nenhuma: `print` dentro de módulo importado não aparece"
  - "Uma vez"
  - "Duas vezes"
  - "Três vezes"
  correta: 1
  explicacao: "Na primeira importação o Python executa o módulo e o guarda em `sys.modules`; as importações seguintes reaproveitam o módulo já carregado."
  topico: modulos-e-organizacao
