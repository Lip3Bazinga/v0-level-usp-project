- enunciado: "Qual teste confere corretamente que `conta.sacar(500)` levanta `SaldoInsuficiente`?"
  opcoes:
  - "`try:` com `conta.sacar(500)` e `except SaldoInsuficiente: pass`"
  - "`with self.assertRaises(SaldoInsuficiente):` e, dentro do bloco, `conta.sacar(500)`"
  - "`self.assertRaises(SaldoInsuficiente, conta.sacar(500))`"
  - "`self.assertEqual(conta.sacar(500), SaldoInsuficiente)`"
  correta: 1
  explicacao: "Dentro do `with`, a exceção é capturada e conferida; se nada for levantado, o teste falha. No segundo caso `sacar` roda antes do `assertRaises`, e o `try` sem `fail` passaria mesmo sem exceção."
  topico: tipagem-testes-e-estilo
