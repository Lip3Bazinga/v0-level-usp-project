  - '[[5, 1], [2, 2]], depois 0.5 0.67'
  correta: 1
  explicacao: 'O confusion_matrix põe a classe real nas linhas e a prevista nas colunas, na ordem 0, 1: [[VN, FP], [FN, VP]] = [[5, 1], [2, 2]]. Precisão = VP / (VP + FP) = 2/3 ≈ 0,67 (das 3 marcações, 2 certas); recall = VP / (VP + FN) = 2/4 = 0,5 (dos 4 positivos, 2 encontrados). [[5, 2], [1, 2]] é a matriz transposta; [[2, 2], [1, 5]] põe o positivo primeiro; a última alternativa troca precisão e recall.'
