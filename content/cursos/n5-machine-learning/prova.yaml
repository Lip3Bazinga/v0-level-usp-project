        [("num", StandardScaler(), ["idade", "renda"]),
         ("cat", OneHotEncoder(handle_unknown="ignore"), ["plano"])],
        remainder="passthrough")
    pipe = Pipeline([("prep", pre), ("modelo", LogisticRegression())])
    X_tr, X_te, y_tr, y_te = train_test_split(
        df, df["cancelou"], stratify=df["cancelou"], random_state=0)
