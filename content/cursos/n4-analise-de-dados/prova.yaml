- enunciado: 'Uma amostra de 10 lotes tem média 50 e desvio padrão amostral (ddof=1) igual a 4. Com stats.t.ppf(0.975, 9) ≈ 2,262, qual é o intervalo de confiança de 95 % da média, com uma casa decimal?'
