- enunciado: 'Com uma amostra aleatória de 100 clientes, o erro padrão da média do tempo de espera foi 3,0 minutos. Mantida a variabilidade, quantos clientes seriam necessários para o erro padrão cair para cerca de 1,0 minuto?'
  opcoes:
  - '300'
  - '173'
  - '900'
  - 'Nenhum número: o erro padrão não depende do tamanho da amostra'
  correta: 2
  explicacao: 'O erro padrão é σ / √n: para dividi-lo por 3, √n precisa triplicar, e n fica 9 vezes maior, 900. 300 supõe que o erro cai na proporção de n; 173 é 100 × √3, a raiz aplicada no lugar errado. O erro padrão cai com n, ao contrário do desvio da população, que não depende da amostra.'
