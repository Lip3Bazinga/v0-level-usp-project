- enunciado: 'Um teste t comparou dois métodos de ensino fictícios, com 12 alunos em cada grupo, e deu p = 0,20. Com α = 0,05, qual conclusão é correta?'
  opcoes:
  - 'Os dois métodos têm o mesmo efeito: o teste provou a hipótese nula'
  - 'Os dados não dão evidência de diferença ao nível de 5 %; uma diferença real pode existir e não ter sido detectada com 12 alunos por grupo'
  - 'Há 20 % de chance de a hipótese nula ser verdadeira'
  - 'Há 80 % de chance de o método novo ser melhor'
  correta: 1
  explicacao: 'Não rejeitar H0 não é provar H0: com amostras pequenas o poder é baixo e um efeito real escapa com facilidade. O p-valor é calculado supondo H0 verdadeira (a chance de uma diferença tão grande ou maior só pelo acaso), então não é a probabilidade de H0, e 1 − p não é a probabilidade de H1.'
