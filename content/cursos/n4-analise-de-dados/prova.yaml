  - '95 % dos lotes têm rendimento entre 47,1 e 52,9'
  - 'Se a coleta fosse repetida, 95 % das médias amostrais cairiam entre 47,1 e 52,9'
  - 'O método, repetido em muitas amostras, gera intervalos que contêm a média verdadeira em cerca de 95 % das vezes'
  correta: 3
  explicacao: 'A média verdadeira é fixa; quem varia é o intervalo. Os 95 % descrevem a taxa de acerto do procedimento, não a deste intervalo, que contém ou não contém a média. O intervalo é sobre a média, não sobre os lotes, que se espalham bem mais. E as médias de novas amostras se distribuem em torno da média verdadeira, não em torno deste intervalo.'
