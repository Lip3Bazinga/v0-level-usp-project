titulo: Prova do Nível 4 — Análise de dados
descricao: 'Banco de 40 questões (10 sorteadas por tentativa) sobre numpy, pandas, limpeza e transformação, agregação e séries temporais, visualização, probabilidade e estatística e o projeto com a amostra do ENEM, na proporção das lições de cada módulo. A maioria pede para prever a saída de um trecho, escolher a operação certa, achar o defeito de um código ou interpretar um resultado estatístico. Nota mínima: 70 %.'
nota_minima: 70
tempo_min: 45
intervalo_min: 60
questoes_por_tentativa: 10
questoes:
- enunciado: |
    O que este trecho imprime?

    m = np.array([[1, 2, 3], [4, 5, 6]])
    print(m.sum(axis=0).tolist())
  opcoes:
  - '[6, 15]'
  - '[5, 7, 9]'
  - '21'
  - '[[5, 7, 9]]'
  correta: 1
  explicacao: 'O eixo passado é o que some: axis=0 soma descendo as linhas e sobra um valor por coluna, 1 + 4, 2 + 5 e 3 + 6. [6, 15] é a soma por linha (axis=1); 21 é a soma sem axis; e a matriz [[5, 7, 9]], de forma (1, 3), só sairia com keepdims=True.'
  topico: numpy
- enunciado: |
    O que este trecho imprime?

    precos = np.array([2.7, -2.7, 1.5])
    print(precos.astype(int).tolist())
  opcoes:
  - '[3, -3, 2]'
  - '[2, -3, 1]'
  - 'ValueError, porque 2.7 não é um inteiro'
  - '[2, -2, 1]'
  correta: 3
  explicacao: 'astype(int) corta a parte fracionária em direção ao zero, sem erro e sem arredondar: 2.7 vira 2 e -2.7 vira -2. [3, -3, 2] seria np.round antes da conversão; [2, -3, 1] seria np.floor, que vai para baixo também nos negativos. O mesmo corte acontece ao gravar 9.99 numa posição de um array inteiro.'
  topico: numpy
- enunciado: |
    O que este trecho imprime?

    a = np.array([10, 20, 30, 40])
    b = a[1:3]
    c = a[[0, 3]]
    b[0] = 0
    c[0] = 0
    print(a.tolist())
  opcoes:
  - '[10, 0, 30, 40]'
  - '[10, 20, 30, 40]'
  - '[0, 0, 30, 40]'
  - '[0, 20, 30, 40]'
  correta: 0
  explicacao: 'A fatia a[1:3] é uma vista: b[0] = 0 escreve no próprio a, na posição 1. A indexação por lista a[[0, 3]] é uma cópia: c[0] = 0 não toca em a. [10, 20, 30, 40] trata a fatia como cópia, como numa lista do Python; [0, 0, 30, 40] trata as duas como vista; [0, 20, 30, 40] inverte as duas regras. Para uma fatia independente, use .copy().'
  topico: numpy
- enunciado: 'A matriz m tem forma (4, 3): 4 lojas nas linhas e 3 produtos nas colunas. Qual expressão subtrai de cada linha a média da própria linha?'
  opcoes:
  - m - m.mean(axis=1)
  - m - m.mean(axis=0)
  - m - m.mean(axis=1, keepdims=True)
  - m - m.mean()
  correta: 2
  explicacao: 'm.mean(axis=1) tem forma (4,); com keepdims=True, (4, 1), que o broadcasting estica pelas 3 colunas. Sem keepdims, as formas (4, 3) e (4,) são alinhadas pela direita, 3 contra 4, e o resultado é ValueError: operands could not be broadcast together with shapes (4,3) (4,). Com axis=0 o código roda, mas tira de cada coluna a média da coluna; m.mean() tira a média geral de tudo.'
  topico: numpy
- enunciado: |
    O que este trecho imprime?

    A = np.array([[1, 2], [3, 4]])
    v = np.array([1, 1])
    print((A @ v).tolist())
  opcoes:
  - '[4, 6]'
  - '[3, 7]'
  - '[[1, 2], [3, 4]]'
  - '10'
  correta: 1
  explicacao: 'A @ v é o produto matricial: cada linha de A com v, 1 + 2 = 3 e 3 + 4 = 7. [4, 6] é v @ A, que soma as colunas: a ordem dos fatores importa. [[1, 2], [3, 4]] é A * v, elemento a elemento com broadcasting. 10 seria somar tudo.'
  topico: numpy
- enunciado: |
    Para simular 10 000 lançamentos de um dado de seis faces, uma colega escreveu:

    rng = np.random.default_rng(7)
    lancamentos = rng.integers(1, 6, size=10_000)

    O que há de errado?
  opcoes:
  - 'O fim é exclusivo: só saem os números de 1 a 5. O certo é rng.integers(1, 7, size=10_000)'
  - 'Nada: saem os números de 1 a 6, como num dado'
  - 'Saem os números de 0 a 5, como em range(6); falta somar 1'
  - 'Cada execução dá uma sequência diferente, porque falta np.random.seed(7)'
  correta: 0
  explicacao: 'Em rng.integers(baixo, alto) o alto fica de fora, como em range: o 6 nunca sai (conferido: os 10 000 valores ficam entre 1 e 5). O início 1 é respeitado, então não há 0. E default_rng(7) já fixa a sequência; np.random.seed é o gerador legado, um estado global que outras partes do programa compartilham, e não deve ser misturado com o rng.'
  topico: numpy
- enunciado: |
    O que este trecho imprime?

    s1 = pd.Series([1, 2], index=["a", "b"])
    s2 = pd.Series([10, 20], index=["b", "c"])
    print((s1 + s2).tolist())
  opcoes:
  - '[11, 22]'
  - '[1.0, 12.0, 20.0]'
  - '[nan, 12.0, nan]'
  - 'ValueError, porque os índices são diferentes'
  correta: 2
  explicacao: 'O pandas soma pelo rótulo, não pela posição: o resultado tem a união dos índices (a, b, c), e só b existe nos dois lados. Onde falta um lado, sai NaN, e a coluna vira float. [11, 22] é a soma por posição, como num array; [1.0, 12.0, 20.0] é s1.add(s2, fill_value=0). Índices diferentes não são erro: são o alinhamento.'
  topico: pandas-fundamentos
- enunciado: |
    Quantos elementos têm as duas seleções abaixo?

    s = pd.Series([5, 6, 7, 8], index=[10, 20, 30, 40])
    s.loc[10:30]
    s.iloc[1:3]
  opcoes:
  - 2 e 2
  - 3 e 3
  - 'Erro no loc, porque 10 e 30 não são posições da Series'
  - 3 e 2
  correta: 3
  explicacao: 'loc usa rótulos e a fatia inclui o fim: 10, 20 e 30 dão [5, 6, 7]. iloc usa posições e exclui o fim, como no Python: posições 1 e 2 dão [6, 7]. 2 e 2 aplica ao loc a regra do Python; 3 e 3 aplica ao iloc a regra do loc. Como loc procura rótulos, 10 e 30 existem e não há erro.'
  topico: pandas-fundamentos
- enunciado: |
    No pandas 3, o que acontece com a linha abaixo?

    df[df["nota"] < 5]["nota"] = 5
  opcoes:
  - 'Aparece o aviso ChainedAssignmentError e nenhuma nota muda; o certo é df.loc[df["nota"] < 5, "nota"] = 5'
  - 'As notas abaixo de 5 viram 5, com um SettingWithCopyWarning que pode ser ignorado'
  - 'Todas as notas viram 5, porque a atribuição vale para a coluna inteira'
  - 'As notas mudam se o filtro for copiado antes: df[df["nota"] < 5].copy()["nota"] = 5'
  correta: 0
  explicacao: 'O filtro devolve uma tabela nova (Copy-on-Write) e a atribuição cai nela, que é jogada fora: df fica igual (conferido no executor, com o aviso ChainedAssignmentError). O SettingWithCopyWarning não existe mais no pandas 3. Com .copy() a atribuição vai para uma cópia explícita: a nota muda só nela, e o pandas ainda mostra o mesmo aviso. Uma atribuição só, com loc, altera df.'
  topico: pandas-fundamentos
- enunciado: |
    O que acontece com o filtro abaixo?

    clientes = pd.DataFrame({"idade": [20, 15, 40], "cidade": ["Norte", "Norte", "Sul"]})
    clientes[clientes["idade"] > 18 & clientes["cidade"] == "Norte"]
  opcoes:
  - 'Devolve a linha da cliente de 20 anos do Norte, como esperado'
  - 'TypeError: o & é avaliado antes das comparações, e o Python tenta calcular 18 & clientes["cidade"]'
  - 'ValueError: The truth value of a Series is ambiguous, o mesmo erro do and'
  - 'Devolve uma tabela vazia, sem erro'
  correta: 1
  explicacao: 'O & tem precedência maior que > e ==, então a conta começa por 18 & clientes["cidade"], um inteiro com uma coluna de texto: TypeError: unsupported operand type(s) for &: ''int'' and ''StringArray''. Cada condição precisa de parênteses: (clientes["idade"] > 18) & (clientes["cidade"] == "Norte"). O ValueError do valor-verdade ambíguo é o que sai com and.'
  topico: pandas-fundamentos
- enunciado: |
    Em que faixa cai cada valor?

    pd.cut(pd.Series([0, 5, 10]), bins=[0, 5, 10])
  opcoes:
  - '(0, 5], (0, 5] e (5, 10]'
  - '[0, 5), [5, 10) e NaN'
  - 'Erro, porque o 0 coincide com a primeira borda'
  - 'NaN, (0, 5] e (5, 10]'
  correta: 3
  explicacao: 'Por padrão (right=True) as faixas são abertas à esquerda e fechadas à direita: o 5 fica em (0, 5], o 10 em (5, 10], e o 0 não cabe em nenhuma, então vira NaN sem erro. include_lowest=True inclui o 0 na primeira faixa. [0, 5), [5, 10) e NaN é o resultado de right=False, em que o 10 é que sobra.'
  topico: pandas-fundamentos
- enunciado: 'O arquivo vendas.csv foi gravado em latin-1 (tem "Pão de queijo" e "Café"), usa ponto e vírgula entre as colunas e traz preços como 1.234,56. Qual leitura dá a coluna de preços como float, com 1234.56?'
  opcoes:
  - 'pd.read_csv("vendas.csv", sep=";", decimal=",", thousands=".")'
  - 'pd.read_csv("vendas.csv", sep=";", decimal=",", encoding="latin-1")'
  - 'pd.read_csv("vendas.csv", sep=";", decimal=",", thousands=".", encoding="latin-1")'
  - 'pd.read_csv("vendas.csv", sep=",", decimal=";", thousands=".", encoding="latin-1")'
  correta: 2
  explicacao: 'Cada parâmetro resolve um defeito. Sem encoding, a leitura em UTF-8 para em UnicodeDecodeError: ''utf-8'' codec can''t decode byte 0xe3. Sem thousands=".", o 1.234,56 não vira número e a coluna inteira fica com dtype str. Com sep e decimal trocados, a linha não é dividida e tudo cai numa coluna só.'
  topico: pandas-fundamentos
- enunciado: |
    O que este trecho imprime?

    s = pd.Series([4.0, np.nan, 8.0])
    s.fillna(0)
    print(s.mean())
  opcoes:
  - '4.0'
  - '6.0'
  - 'nan'
  - '4.0 no pandas 2 e 6.0 no pandas 3, por causa do Copy-on-Write'
  correta: 1
  explicacao: 'fillna devolve uma Series nova, e o resultado foi descartado: s continua com o NaN. O mean ignora ausentes, (4 + 8) / 2 = 6.0. 4.0 seria (4 + 0 + 8) / 3, a média com o ausente trocado por zero; nan é o que a aritmética faz (s + 1 propaga), não as reduções. fillna sem atribuição nunca alterou a Series, em versão nenhuma.'
  topico: limpeza-e-transformacao
- enunciado: |
    As datas abaixo estão no formato dia/mês/ano: 3 e 10 de abril. O que o trecho imprime?

    d = pd.to_datetime(pd.Series(["03/04/2025", "10/04/2025"]))
    print(d.dt.month.tolist())
  opcoes:
  - '[3, 10]'
  - '[4, 4]'
  - 'ValueError, porque as datas são ambíguas'
  - '[NaT, NaT]'
  correta: 0
  explicacao: 'Sem format, o pandas supõe mês/dia/ano e, como nenhum dia passa de 12, converte sem erro: 4 de março e 4 de outubro. O ValueError (time data "13/04/2025" doesn''t match format "%m/%d/%Y") só aparece quando surge um dia acima de 12. [4, 4] exige format="%d/%m/%Y" (ou dayfirst=True). NaT só sairia com errors="coerce" e datas inválidas.'
  topico: limpeza-e-transformacao
- enunciado: |
    p = pd.Series(["R$ 1.234,56", "R$ 89,90"]) e t = p.str.replace("R$ ", "", regex=False). Qual expressão dá os números 1234.56 e 89.9?
  opcoes:
  - 't.astype(float)'
  - 'pd.to_numeric(t.str.replace(",", ".", regex=False).str.replace(".", "", regex=False))'
  - 'pd.to_numeric(t.str.replace(".", "", regex=True).str.replace(",", ".", regex=False), errors="coerce")'
  - 'pd.to_numeric(t.str.replace(".", "", regex=False).str.replace(",", ".", regex=False))'
  correta: 3
  explicacao: 'A ordem importa: primeiro sai o ponto de milhar, depois a vírgula vira ponto decimal. Trocar a vírgula antes faz o segundo replace apagar também o ponto decimal, e saem 123456 e 8990. Com regex=True o "." casa qualquer caractere, o texto inteiro some e o coerce devolve dois NaN. astype(float) para em ValueError: could not convert string to float: ''1.234,56''.'
  topico: limpeza-e-transformacao
- enunciado: |
    Tempos de entrega fictícios, em minutos:

    s = pd.Series([10, 12, 11, 13, 12, 95])

    Com o quantile padrão do pandas, Q1 = 11,25 e Q3 = 12,75. Qual é o limite superior da regra do IQR e quem fica fora dos limites?
  opcoes:
  - '14,25, e só o 95 fica fora'
  - '140,25, e ninguém fica fora'
  - '15,0, e só o 95 fica fora'
  - '15,0, e o 10 também fica fora, porque o limite inferior é 10,5'
  correta: 2
  explicacao: 'IQR = 12,75 − 11,25 = 1,5; limites: 11,25 − 1,5 × 1,5 = 9,0 e 12,75 + 1,5 × 1,5 = 15,0. Só o 95 passa. 14,25 soma o IQR sem o fator 1,5; 140,25 usa a amplitude (95 − 10 = 85) no lugar do IQR; 10,5 é 12,75 − 2,25, o limite inferior calculado a partir de Q3. Note que a regra |z| > 3 não marcaria o 95: o próprio outlier infla o desvio e o z dele fica em 2,04.'
  topico: limpeza-e-transformacao
- enunciado: |
    Qual é a forma (shape) de longo?

    largo = pd.DataFrame({"loja": ["A", "B", "C"], "jan": [1, 2, 3], "fev": [4, 5, 6], "mar": [7, 8, 9]})
    longo = largo.melt(id_vars="loja")
  opcoes:
  - (9, 3)
  - (3, 4)
  - (12, 2)
  - (9, 2)
  correta: 0
  explicacao: 'Cada loja vira uma linha por mês, 3 × 3 = 9 linhas, com as colunas loja, variable e value. (3, 4) é a tabela larga original; (12, 2) é largo.melt() sem id_vars, que derrete também a coluna loja; (9, 2) esquece que a coluna de identificação é mantida.'
  topico: limpeza-e-transformacao
- enunciado: |
    Quantas linhas tem a junção?

    a = pd.DataFrame({"k": [1, 1, 2, 3], "x": [10, 20, 30, 40]})
    b = pd.DataFrame({"k": [1, 1, 2, 4], "y": [5, 6, 7, 8]})
    a.merge(b, on="k")
  opcoes:
  - '2'
  - '5'
  - '4'
  - '6'
  correta: 1
  explicacao: 'O merge interno faz todos os pares com a mesma chave: o 1 aparece duas vezes em cada lado e gera 2 × 2 = 4 linhas, e o 2 gera mais 1. O 3 e o 4 só existem de um lado e somem. 2 conta uma linha por chave comum; 4 supõe que o tamanho não muda; 6 é o how="left", que mantém o 3 com NaN. Chave repetida dos dois lados multiplica linhas: validate="one_to_many" pega isso.'
  topico: limpeza-e-transformacao
- enunciado: |
    O que este trecho imprime?

    df = pd.DataFrame({"loja": ["A", "A", "B", "B", "B"], "valor": [10, np.nan, 5, 5, 20]})
    g = df.groupby("loja")["valor"]
    print(g.size().tolist(), g.count().tolist(), g.mean().tolist())
  opcoes:
  - '[2, 3] [2, 3] [5.0, 10.0]'
  - '[1, 3] [2, 3] [10.0, 10.0]'
  - '[2, 3] [1, 3] [5.0, 10.0]'
  - '[2, 3] [1, 3] [10.0, 10.0]'
  correta: 3
  explicacao: 'size conta as linhas do grupo, com ou sem NaN (A tem 2); count conta só os valores presentes (A tem 1); mean ignora o NaN, e a média de A é 10 / 1 = 10.0. A primeira opção trata o ausente como zero; a segunda troca size e count; a terceira divide a soma de A pelo size.'
  topico: agregacao-e-series-temporais
- enunciado: 'A tabela vendas tem 1 000 linhas e as colunas uf (27 valores) e valor. A = vendas.groupby("uf")["valor"].mean() e B = vendas.groupby("uf")["valor"].transform("mean"). Quantas linhas tem cada uma, e qual serve para criar a coluna vendas["media_uf"]?'
  opcoes:
  - 'As duas têm 1 000 linhas, e qualquer uma serve'
  - 'A tem 27 e B tem 1 000, e as duas servem, porque o pandas alinha pela UF'
  - 'A tem 27 e B tem 1 000; só B serve'
  - 'As duas têm 27 linhas; para criar a coluna é preciso um merge'
  correta: 2
  explicacao: 'mean reduz a uma linha por grupo; transform devolve um valor por linha original, com o índice de vendas. Gravar A em vendas["media_uf"] não dá erro, mas a coluna sai inteira com NaN: o índice de A são as UFs e o de vendas são 0 a 999, e a atribuição alinha pelo índice, não pela coluna uf. O merge de A com vendas também funciona, mas o transform faz isso numa linha.'
  topico: agregacao-e-series-temporais
- enunciado: |
    A tabela longa tem duas vendas da região Norte em janeiro, de 100 e 200 reais. A tabela dinâmica abaixo mostra 150 para Norte em janeiro. O que fazer para ver o total do mês?

    pd.pivot_table(vendas, index="regiao", columns="mes", values="vendas")
  opcoes:
  - 'Passar aggfunc="sum": o padrão do pivot_table é a média'
  - 'Apagar a linha repetida com drop_duplicates antes da tabela'
  - 'Trocar por vendas.pivot(index="regiao", columns="mes", values="vendas"), que soma as repetidas'
  - 'Passar margins=True, que acrescenta a linha de totais'
  correta: 0
  explicacao: 'Com o aggfunc padrão, as duas vendas viram a média, 150; com aggfunc="sum", 300. As duas linhas são vendas diferentes, não duplicatas: apagar uma perde 100 ou 200 reais. pivot não agrega e para em ValueError: Index contains duplicate entries, cannot reshape. margins=True acrescenta a linha e a coluna All, mas com a mesma função de agregação, a média.'
  topico: agregacao-e-series-temporais
- enunciado: 'vendas é uma Series diária, com índice de datas de janeiro de 2024 a dezembro de 2025. vendas.resample("M").sum() terminou em ValueError: Invalid frequency: M. Qual expressão dá o total de cada um dos 24 meses?'
  opcoes:
  - vendas.groupby(vendas.index.month).sum()
  - vendas.rolling(30).sum()
  - vendas.asfreq("ME")
  - vendas.resample("ME").sum()
  correta: 3
  explicacao: 'No pandas 3 o fim de mês se escreve "ME" (a própria mensagem do erro sugere a troca), e resample("ME").sum() devolve 24 totais. Agrupar por index.month devolve 12 linhas, somando janeiro de 2024 com janeiro de 2025. rolling(30) é uma janela móvel, com um valor por dia. asfreq("ME") só pega o valor do último dia de cada mês, sem somar.'
  topico: agregacao-e-series-temporais
- enunciado: |
    Em qual painel aparece o título?

    fig, axs = plt.subplots(1, 2)
    axs[0].plot([1, 2, 3])
    plt.title("Receita")
  opcoes:
  - 'No da esquerda, axs[0], o último em que se desenhou'
  - 'No da direita, axs[1], o último criado pelo subplots'
  - 'Acima dos dois, como título da figura'
  - 'Nos dois painéis'
  correta: 1
  explicacao: 'plt.title age no Axes atual, e depois de subplots(1, 2) o atual é o último criado, axs[1]. Desenhar com axs[0].plot não muda o Axes atual (conferido: axs[0].get_title() fica vazio e axs[1].get_title() é Receita). O título da figura é fig.suptitle. Para não depender do Axes atual, use axs[0].set_title("Receita").'
  topico: visualizacao
- enunciado: 'Você quer comparar a distribuição do tempo de entrega de cinco transportadoras fictícias, cada uma com centenas de entregas, e mostrar quais têm atrasos muito longos. Qual gráfico responde melhor?'
  opcoes:
  - Barras com o tempo médio de cada transportadora
  - Uma pizza com o total de entregas de cada transportadora
  - Um boxplot por transportadora, lado a lado
  - Uma linha ligando os tempos médios das cinco transportadoras
  correta: 2
  explicacao: 'O boxplot mostra mediana, quartis e os pontos extremos de cada grupo, lado a lado: é a pergunta de distribuição. As barras de média escondem a dispersão e os atrasos longos (duas transportadoras com a mesma média podem ser muito diferentes). A pizza mostra participação no total, outra pergunta. A linha sugere uma ordem ou evolução entre categorias que não existe.'
  topico: visualizacao
- enunciado: 'Para saber se quem estuda mais horas tira notas maiores, você tem as horas de estudo e a nota de 300 alunos fictícios. Qual gráfico usar?'
  opcoes:
  - 'Dispersão: ax.scatter(horas, notas), um ponto por aluno'
  - 'Linha: ax.plot(horas, notas), que mostra a tendência'
  - 'Barras com a nota de cada aluno, na ordem da tabela'
  - 'Histograma das notas'
  correta: 0
  explicacao: 'Relação entre duas variáveis numéricas é dispersão. ax.plot liga os pontos na ordem da tabela e desenha um zigue-zague sem significado. Barras de 300 alunos não mostram as horas. O histograma mostra só a distribuição das notas, sem as horas.'
  topico: visualizacao
- enunciado: 'Num gráfico de linha com os atendimentos de três trimestres (950, 970 e 1 010), o matplotlib escolheu sozinho o eixo y de 947 a 1 013. No gráfico de barras com os mesmos números, o eixo foi de 0 a 1 060. Um colega quer fazer as barras "imitarem" a linha com ax.set_ylim(940, 1020). O que você responde?'
  opcoes:
  - 'Pode: aproximar o eixo mostra melhor a diferença, e o gráfico de linha já faz isso'
  - 'Pode, desde que os valores exatos fiquem escritos em cima das barras'
  - 'Não tem efeito: o set_ylim é ignorado em gráficos de barras, que sempre começam no zero'
