  - 47,5 a 52,5
  - 47,2 a 52,8
  - 41,0 a 59,0
  correta: 0
  explicacao: 'O erro padrão é 4 / √10 ≈ 1,265, e 2,262 × 1,265 ≈ 2,86: de 47,1 a 52,9. 47,5 a 52,5 usa 1,96, o quantil da normal, que com n = 10 e desvio estimado entrega menos de 95 %. 47,2 a 52,8 usa o t com 10 graus de liberdade (2,228) em vez de n − 1 = 9. 41,0 a 59,0 multiplica o desvio sem dividir por √n: é uma faixa para os lotes, não para a média.'
