- enunciado: |
    Uma colega escreveu a maior soma de um trecho contíguo não vazio assim. O que a função devolve para [-3, -1, -4], e qual é a resposta certa?

    def soma_maxima(v):
        melhor = atual = 0
        for x in v:
            atual = max(0, atual + x)
            melhor = max(melhor, atual)
        return melhor
  opcoes:
  - Devolve -1, que é a resposta certa
  - 'Devolve 0, que é a resposta certa: o trecho vazio soma 0'
  - Devolve 0; a resposta certa é -1
  - Devolve -8; a resposta certa é -8, a soma da lista inteira
  correta: 2
  explicacao: 'Com max(0, …) e melhor começando em 0, o resultado nunca fica negativo. Numa lista só de negativos, o melhor trecho não vazio é o maior elemento sozinho, -1; o trecho vazio não vale, pelo enunciado. A soma da lista inteira, -8, é o pior trecho, não o melhor. O Kadane certo usa atual = max(x, atual + x) e começa melhor com o primeiro elemento.'
