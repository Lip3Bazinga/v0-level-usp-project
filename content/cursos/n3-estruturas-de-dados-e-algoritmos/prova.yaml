- enunciado: |
    O programa abaixo é o começo de uma ordenação topológica por DFS, mas o autor esqueceu de inverter a lista no fim. O que ele imprime?

    grafo = {"cueca": ["calca"], "calca": ["sapato"], "meia": ["sapato"], "sapato": []}
    visitados = set()
    pos_ordem = []

    def visitar(u):
        visitados.add(u)
        for v in grafo[u]:
            if v not in visitados:
                visitar(v)
        pos_ordem.append(u)

    for v in grafo:
        if v not in visitados:
            visitar(v)
    print(pos_ordem)
  opcoes:
  - "['sapato', 'calca', 'cueca', 'meia']"
  - "['meia', 'cueca', 'calca', 'sapato']"
  - "['cueca', 'calca', 'sapato', 'meia']"
  - "['cueca', 'calca', 'meia', 'sapato']"
  correta: 0
  explicacao: 'Um vértice termina só depois de tudo o que ele alcança: sapato termina primeiro, depois calca e cueca, e por último meia, que encontra sapato já visitado. Na lista de términos, toda aresta aponta para trás (sapato antes de meia); invertida, [''meia'', ''cueca'', ''calca'', ''sapato''], ela é uma ordenação topológica. [''cueca'', ''calca'', ''sapato'', ''meia''] é a ordem em que a busca entra nos vértices, e a ordem das chaves do dicionário não leva as arestas em conta.'
