titulo: 'Prova do Nível 6 — Deep Learning: a IA por dentro'
descricao: 'Banco de 40 questões (10 sorteadas por tentativa) sobre perceptron, autograd, treino de redes, MLP, CNN, RNN, atenção, transformers e limitações. Nota mínima: 70 %.'
nota_minima: 70
tempo_min: 45
intervalo_min: 60
questoes_por_tentativa: 10
questoes:
- enunciado: |-
    Um perceptron usa a convenção da lição: a saída é 1 só quando z > 0. O que o trecho imprime?

    X = np.array([[0, 0], [0, 1], [1, 0], [1, 1]])
    w = np.array([2.0, 1.0])
    b = -2.0
    z = X @ w + b
    print((z > 0).astype(int).tolist())
  opcoes:
  - '[0, 0, 1, 1]'
  - '[0, 1, 1, 1]'
  - '[0, 0, 0, 1]'
  - '[1, 1, 1, 1]'
  correta: 2
  explicacao: 'z vale [-2, -1, 0, 1], e só o último passa de zero. [0, 0, 1, 1] é o degrau com z >= 0, que conta o z = 0 como 1. [0, 1, 1, 1] é o que sai quando o viés é esquecido. [1, 1, 1, 1] é o viés com o sinal trocado (+2).'
  topico: neuronios-e-perceptron
- enunciado: |-
    Uma rede 1 → 2 → 1 tem os pesos abaixo e vieses zero. Ela é calculada duas vezes: sem ativação entre as camadas e com ReLU na camada escondida. O que o trecho imprime?

    X = np.array([[-3.0], [2.0]])
    W1 = np.array([[1.0, -1.0]])
    W2 = np.array([[1.0], [1.0]])
    sem = (X @ W1) @ W2
    com = np.maximum(0, X @ W1) @ W2
    print(sem.ravel().tolist(), com.ravel().tolist())
  opcoes:
  - '[0.0, 0.0] [3.0, 2.0]'
  - '[0.0, 0.0] [0.0, 0.0]'
  - '[-6.0, 4.0] [3.0, 2.0]'
  - '[0.0, 0.0] [0.0, 2.0]'
  correta: 0
  explicacao: 'Sem ativação, as duas camadas são uma só: W1 @ W2 = [[0]], e a saída é 0 para qualquer x. Com a ReLU, cada neurônio escondido deixa passar um lado, e a soma dá o módulo de x. Dois zeros nas duas contas supõe que a ReLU não muda uma composição linear. [-6.0, 4.0] ignora o sinal do peso -1. [0.0, 2.0] conta só o neurônio de peso 1 e perde o que responde às entradas negativas.'
  topico: neuronios-e-perceptron
- enunciado: |-
    Alguém escreve a sigmoide pela fórmula direta. O numpy só mostra um aviso e segue. O que o trecho imprime?

    z = np.array([-1000.0, 0.0, 1000.0])
    s = np.exp(z) / (1 + np.exp(z))
    print(s.tolist())
  opcoes:
  - '[0.0, 0.5, 1.0]'
  - '[nan, 0.5, nan]'
  - '[0.0, 0.5, inf]'
  - '[0.0, 0.5, nan]'
  correta: 3
  explicacao: 'exp(1000) estoura para inf, e inf / inf dá nan; exp(-1000) vale 0, e 0 / 1 dá 0. [0.0, 0.5, 1.0] é o que a versão estável devolve, não esta. No lado negativo não há nan, porque nada estoura ali. inf dividido por inf não é inf.'
  topico: neuronios-e-perceptron
- enunciado: |-
    Uma camada tem 400 entradas com desvio 1 e pesos sorteados com desvio 0,1. O que o trecho imprime?

    rng = np.random.default_rng(0)
    X = rng.normal(0, 1, (2000, 400))
    W = rng.normal(0, 0.1, (400, 50))
    print(round(float((X @ W).std()), 1))
  opcoes:
  - '0.1'
  - '2.0'
  - '4.0'
  - '40.0'
  correta: 1
  explicacao: 'A variância da pré-ativação é d_in vezes a variância dos pesos vezes a das entradas: 400 · 0,01 · 1 = 4, desvio 2. 0.1 ignora que cada pré-ativação soma 400 parcelas. 4.0 é a variância, não o desvio. 40.0 multiplica d_in pelo desvio, como se desvios se somassem.'
  topico: neuronios-e-perceptron
- enunciado: 'No grafo de L = (a * b + c) * f, com a = 3, b = 2, c = -1 e f = 4, quanto valem a derivada de L em relação a a e a derivada de L em relação a b?'
  opcoes:
  - 12 e 8
  - 8 e 12
  - 2 e 3
  - 6 e 7
  correta: 1
  explicacao: 'O gradiente que chega ao produto a * b é f = 4. A derivada local em relação a a é b, e em relação a b é a: 4 · 2 = 8 e 4 · 3 = 12. 12 e 8 usa o próprio operando no lugar do outro. 2 e 3 esquece de multiplicar pelo gradiente que vem de cima. 6 e 7 soma o gradiente de cima à derivada local no lugar de multiplicar.'
  topico: autograd-do-zero
- enunciado: 'Numa classe Valor, um caso de teste faz a = Valor(2.0), b = Valor(5.0), c = a * b, c.grad = 1.0 e c._backward(). A lista [a.grad, b.grad] sai [2.0, 5.0], e o esperado era [5.0, 2.0]. Qual defeito produz exatamente essa saída?'
  opcoes:
  - O _backward do produto usa = no lugar de +=
  - O grad da saída ficou em 0 antes da chamada
  - Falta o __rmul__ na classe
  - O _backward do produto multiplica cada operando pelo próprio dado, e não pelo dado do outro
  correta: 3
  explicacao: 'A derivada de a * b em relação a a é b: o gradiente de a deveria ser 5, e saiu 2, o dado do próprio a. Com = no lugar de +=, este caso passaria, porque cada operando aparece uma vez só (o defeito aparece em v * v). Com o grad da saída em 0, a lista seria [0.0, 0.0]. Sem __rmul__, o erro seria um TypeError em contas como 2 * v, que este caso não faz.'
  topico: autograd-do-zero
- enunciado: |-
    Com a classe Valor da lição, alguém chama os _backward na ordem direta, das entradas para a saída. O que o trecho imprime?

    a = Valor(2.0)
    b = a * 3
    c = b * 2
    c.grad = 1.0
    for no in [a, b, c]:
        no._backward()
    print(a.grad, b.grad)
  opcoes:
  - '0.0 2.0'
  - '6.0 2.0'
  - '0.0 0.0'
  - '3.0 2.0'
  correta: 0
  explicacao: 'O _backward de b roda quando b.grad ainda é 0 e repassa 3 · 0 para a; só depois o de c põe 2 em b, tarde demais. 6.0 2.0 é o resultado da ordem inversa (c, b, a), a correta. 0.0 0.0 sairia se o grad da saída não fosse posto em 1. 3.0 2.0 supõe que a recebe a derivada local sem o gradiente de cima.'
  topico: autograd-do-zero
- enunciado: |-
    A divisão do Valor é escrita como a * b ** -1. O que o trecho imprime?

    a = Valor(6.0)
    b = Valor(3.0)
    c = a / b
    c.backward()
    print(round(a.grad, 3), round(b.grad, 3))
  opcoes:
  - '0.333 0.667'
  - '3.0 6.0'
  - '0.333 -0.667'
  - '0.333 -2.0'
  correta: 2
  explicacao: 'A derivada de a / b em relação a a é 1 / b = 0,333, e em relação a b é -a / b², ou -6 / 9. O sinal positivo esquece que o expoente -1 desce multiplicando. 3.0 6.0 trata a divisão como produto. -2.0 é a potência derivada como k · x^k, sem baixar o expoente: -1 · 3^-1 · 6.'
  topico: autograd-do-zero
- enunciado: 'Um MLP com 5 entradas, uma camada escondida de 8 neurônios e uma saída de 2 neurônios é montado com as classes da lição: cada neurônio tem um peso por entrada e um viés. Quanto vale len(mlp.parametros())?'
  opcoes:
  - '56'
  - '80'
  - '66'
  - '64'
  correta: 2
  explicacao: 'A camada escondida tem 5 · 8 + 8 = 48 parâmetros e a saída, 8 · 2 + 2 = 18. 56 é a conta sem nenhum viés, o que sai quando parametros() esquece os vieses. 80 multiplica os três tamanhos. 64 esquece os vieses da camada de saída.'
  topico: autograd-do-zero
- enunciado: |-
    Um treino com Valor usa taxa 0,01. A perda sobe um pouco a cada passo, desde o primeiro, sem oscilar. O laço é este:

    for passo in range(100):
        perda = calcular_perda(mlp, X, y)
        for p in mlp.parametros():
            p.grad = 0.0
        perda.backward()
        for p in mlp.parametros():
            p.dado += taxa * p.grad

    Qual é o defeito?
  opcoes:
  - 'A atualização soma o gradiente e anda no sentido em que a perda cresce; o certo é p.dado -= taxa * p.grad'
  - Os gradientes são zerados no lugar errado e deveriam ser zerados depois do backward
  - A taxa 0,01 é alta demais para uma rede com tanh
  - O método parametros() devolve cópias dos parâmetros
  correta: 0
  explicacao: 'O gradiente aponta para onde a perda sobe; somar em vez de subtrair faz a perda crescer a cada passo. Zerar antes do backward é o lugar certo: zerar depois apagaria o gradiente antes da atualização. Uma taxa alta faz a perda oscilar ou saturar, não subir devagar e sempre. Com cópias, os parâmetros não mudariam e a perda ficaria igual em todos os passos.'
  topico: autograd-do-zero
- enunciado: |-
    O trecho calcula o gradiente da entropia cruzada média em relação aos logits, com a softmax estável da lição. O que ele imprime?

    Z = np.zeros((2, 4))
    y = np.array([1, 3])
    G = softmax(Z)
    G[np.arange(2), y] -= 1
    G /= 2
    print(G[0].tolist())
  opcoes:
  - '[0.25, -0.75, 0.25, 0.25]'
  - '[0.125, 0.125, 0.125, 0.125]'
  - '[-0.375, 0.125, 0.125, 0.125]'
  - '[0.125, -0.375, 0.125, 0.125]'
  correta: 3
  explicacao: 'Com logits iguais, cada probabilidade vale 0,25; subtrai-se 1 na classe certa do exemplo 0, a classe 1, e divide-se por n = 2. [0.25, -0.75, 0.25, 0.25] é o gradiente sem a divisão por n. A lista só com 0.125 não subtraiu o 1 da classe certa. Com -0.375 na primeira posição, o 1 foi subtraído na classe 0, e o rótulo é 1.'
  topico: treinando-redes
- enunciado: 'A perda de validação por época foi [0.92, 0.61, 0.58, 0.58, 0.63], com as épocas contadas a partir de 0. A função melhor_estado escolhe a menor perda e desempata pela época mais cedo. Qual índice ela devolve?'
  opcoes:
  - '3'
  - '2'
  - '0'
  - '4'
  correta: 1
  explicacao: 'A menor perda, 0,58, aparece nas épocas 2 e 3, e o desempate fica com a mais cedo. 3 é o que sai quando a comparação aceita o empate e troca pelo estado mais novo. 0 escolhe o maior valor, a pior época. 4 é o último estado, o que se tem quando nenhum melhor estado é guardado.'
  topico: treinando-redes
- enunciado: |-
    Um classificador de 10 classes treina com mini-lotes. A perda fica perto de 2,30 em todas as épocas e a acurácia de treino não sai de 0,10. A preparação de cada época é esta:

    X = X[rng.permutation(n)]
    y = y[rng.permutation(n)]

    Qual é a causa?
  opcoes:
  - 'X e y são embaralhados com permutações diferentes: cada exemplo fica com o rótulo de outro, e não há relação para aprender'
  - Embaralhar a cada época atrapalha, e o certo é embaralhar uma vez só antes do treino
  - O último lote, menor que os outros, foi descartado
  - O gradiente do lote foi somado no lugar de tirar a média
  correta: 0
  explicacao: 'Cada chamada sorteia uma permutação nova; X e y precisam ser indexados pela mesma. Com rótulos desalinhados, o melhor que a rede faz é o chute uniforme: perda ln 10 = 2,30 e acurácia 0,10. Embaralhar a cada época é o procedimento normal. Perder o último lote só tira alguns exemplos de cada época. A soma no lugar da média muda a escala do passo, e a rede ainda aprenderia ou divergiria, sem ficar parada no chute.'
  topico: treinando-redes
- enunciado: |-
    O momentum abaixo guarda a média móvel dos gradientes. O que o trecho imprime?

    v = 0.0
    x = 1.0
    for g in [2.0, 2.0]:
        v = 0.9 * v + 0.1 * g
        x = x - 0.5 * v
    print(round(v, 2), round(x, 2))
  opcoes:
  - '0.2 0.8'
  - '3.8 -1.9'
  - '0.38 0.71'
  - '0.2 0.9'
  correta: 2
  explicacao: 'No primeiro passo v = 0,2 e x = 0,9; no segundo, v = 0,9 · 0,2 + 0,2 = 0,38 e x = 0,9 - 0,19 = 0,71. 0.2 0.8 esquece de carregar a velocidade de um passo para o outro. 3.8 -1.9 soma o gradiente inteiro, sem o fator 0,1 da média móvel. 0.2 0.9 para no primeiro passo.'
  topico: treinando-redes
- enunciado: 'Um Adam com correção de viés (beta1 = 0,9, beta2 = 0,999, eps = 1e-8 e t começando em 1) usa taxa 0,01. No primeiro passo, um parâmetro recebe gradiente 0,5 e outro recebe gradiente 50. Quanto cada um anda?'
  opcoes:
  - 0,005 e 0,5
  - 0,0316 e 0,0316
  - 0,01 e 1,0
  - 0,01 e 0,01
  correta: 3
  explicacao: 'Com a correção, no primeiro passo o momento corrigido é g e a raiz da escala corrigida é o módulo de g: o passo é a taxa, 0,01, qualquer que seja o tamanho do gradiente. 0,005 e 0,5 é o passo da descida simples, taxa vezes gradiente. 0,0316 é o Adam sem a correção de viés (0,1 g sobre a raiz de 0,001 g²). 0,01 e 1,0 supõe que o passo ainda cresce com o gradiente.'
  topico: treinando-redes
- enunciado: |-
    O trecho normaliza um lote de 2 exemplos com 3 atributos. O que ele imprime?

    X = np.array([[1.0, 2.0, 3.0], [10.0, 20.0, 30.0]])
    m = X.mean(axis=1, keepdims=True)
    v = X.var(axis=1, keepdims=True)
    print(np.round((X - m) / np.sqrt(v + 1e-5), 2).tolist())
