  correta: 1
  explicacao: 'Com axis=1, cada exemplo é normalizado pela própria média e variância (a conta da LayerNorm): as duas linhas saem iguais, apesar da escala 10 vezes maior. A primeira opção normaliza no eixo do lote, axis=0, a conta da BatchNorm em treino. [-1.0, 0.0, 1.0] usa a variância com ddof=1. A última divide a segunda linha pelo desvio da primeira.'
  topico: treinando-redes
