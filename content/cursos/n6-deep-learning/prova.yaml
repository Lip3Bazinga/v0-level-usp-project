  opcoes:
  - c = 1,5 e h = 1,5
  - c = 1,5 e h = 0,905
  - c = 0,5 e h = 0,462
  - c = 2,5 e h = 0,987
  correta: 1
  explicacao: 'c = f · c anterior + i · g = 1,0 + 0,5 = 1,5, e h = o · tanh(c) = 0,905. h = 1,5 esquece a tanh na saída. c = 0,5 multiplica as duas parcelas no lugar de somar, e perde o caminho aditivo da célula. c = 2,5 ignora a porta de esquecimento e guarda o c anterior inteiro.'
