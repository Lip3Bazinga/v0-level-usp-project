  - '(5, 20) (5,) (8, 20)'
  - '(20, 5) (8,) (8, 20)'
  - '(20, 5) (5,) (8, 5)'
  correta: 0
  explicacao: 'Cada gradiente tem a forma daquilo que ele deriva: dW como W, db com um número por neurônio, dX como X. (5, 20) é a transposta, o que dZ.T @ X daria. (8,) soma no eixo dos neurônios e deixa um número por exemplo. (8, 5) é a forma de dZ: faltou voltar por W.T.'
  topico: mlp-em-numpy
- enunciado: |-
    A checagem numérica de um MLP de 3 camadas, com 6 exemplos, devolve um par (erro de dW, erro de db) por camada:

    [(7.8e-11, 0.714), (4.0e-11, 0.714), (3.3e-11, 0.714)]

    Qual é o defeito?
  opcoes:
  - O gradiente inteiro foi dividido por n duas vezes
  - A máscara da ReLU não foi aplicada no backward
  - 'O db usa a média de dZ no lote, mas dZ já vem dividido por n: só os vieses saem com um fator n a mais na divisão'
  - O passo h = 1e-5 é grande demais para os vieses
  correta: 2
  explicacao: 'O erro (n - 1) / (n + 1) = 5 / 7 = 0,714 é a assinatura de um fator n entre o analítico e o numérico, e aqui ele só aparece nos vieses: os dW estão certos. Se o gradiente inteiro fosse dividido duas vezes, os dW também dariam 0,714. Sem a máscara da ReLU, erram dW e db das primeiras camadas, e a última fica certa. Um h grande demais dá erros perto de 1e-7, não de 0,7.'
  topico: mlp-em-numpy
- enunciado: |-
    A padronização dos dígitos é feita assim, e a perda sai nan já no primeiro passo. Os pixels dos cantos valem 0 em todas as imagens de treino.

    media = X_treino.mean(axis=0)
    desvio = X_treino.std(axis=0)
    X_treino = (X_treino - media) / desvio

    Qual é a correção?
  opcoes:
  - Reduzir a taxa de aprendizado, porque nan no primeiro passo indica divergência
  - 'Trocar por 1 o desvio das colunas em que ele é zero: nelas a conta é 0 / 0, que dá nan'
  - Converter os rótulos para inteiros, porque rótulos float geram nan na indexação
  - Padronizar o treino com a média e o desvio da validação
  correta: 1
  explicacao: 'Um pixel constante tem desvio 0, e (0 - 0) / 0 dá nan em silêncio; o nan entra no forward e na perda. A taxa não participa da primeira perda, calculada antes de qualquer atualização. Rótulos float dão IndexError, não nan. As estatísticas vêm sempre do treino, e as da validação teriam o mesmo desvio zero nos cantos.'
