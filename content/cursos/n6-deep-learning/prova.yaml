  - O modelo usa a informação de plural para escolher o próximo token
  - A sonda decorou os estados, e o 0,93 não quer dizer nada
  - A informação de plural pode ser recuperada dos estados por uma conta linear; se o modelo a usa para gerar, a sonda não diz
  - Os pesos de atenção do modelo explicam por que ele acerta o plural
