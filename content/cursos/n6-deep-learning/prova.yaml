- enunciado: |-
    Uma implementação de atenção devolve os pesos abaixo para uma sequência de 2 posições, uma linha por posição que consulta. As linhas somam 0,85 e 1,15; as colunas somam 1.

    [[0.119, 0.731],
     [0.881, 0.269]]

