  correta: 1
  explicacao: 'Indexar a tabela com um array (50, 4) devolve uma linha de 8 números para cada índice: (50, 4, 8). Achatado, cada exemplo vira 4 · 8 = 32 números, a entrada da camada escondida. (50, 8) supõe um embedding por exemplo, e não um por caractere do contexto. (50, 4, 27) é a forma do one-hot, que a indexação dispensa. (50, 27, 8) copiaria a tabela inteira para cada exemplo.'
  topico: sequencias-embeddings-e-rnn
- enunciado: |-
    Uma RNN de uma unidade tem peso recorrente 0,5. O trecho acumula a derivada do estado final em relação ao estado inicial ao longo de 3 passos. O que se pode afirmar sobre o valor impresso?

    w = 0.5
    h = 0.0
    fator = 1.0
    for x in [1.0, 1.0, 1.0]:
        h = np.tanh(w * h + x)
        fator = fator * w * (1 - h ** 2)
    print(round(float(fator), 4))
  opcoes:
  - É 0.125, porque só o peso recorrente entra no produto
  - É 1.5, porque as contribuições dos três passos se somam
  - É maior que 0.125, porque as entradas iguais a 1 reforçam o estado
  - É 0.0024, bem menor que 0.125, porque cada passo multiplica também por 1 - h ** 2
  correta: 3
  explicacao: 'A derivada de um passo é o peso vezes a derivada da tanh, 1 - h², que aqui fica bem abaixo de 1 porque o estado está perto da saturação. 0,125 é 0,5 ao cubo e esquece a derivada da tanh. Ao longo do tempo os fatores se multiplicam, não se somam. Entradas grandes saturam a tanh e encolhem o gradiente; não o aumentam.'
