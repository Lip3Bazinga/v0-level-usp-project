  explicacao: 'A sonda mede se a informação está disponível nos estados, e o controle com rótulos embaralhados, perto do acaso, mostra que o 0,93 não vem da capacidade da própria sonda. Disponível não é o mesmo que usada: para afirmar uso, seria preciso intervir nos estados e ver a saída mudar. A hipótese de decorar cai com a medida em estados de teste e com o controle. Os pesos de atenção nem entraram na medida, e mostram para onde a média ponderada olhou, não a causa da saída.'
