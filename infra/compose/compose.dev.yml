# Desenvolvimento local: só o PostgreSQL (e, opcionalmente, o executor).
#   docker compose -f infra/compose/compose.dev.yml up -d
# Depois: pnpm dev (web :3000, api :4000) e o executor com `pnpm --filter @levelusp/runner dev`
# (requer `pnpm --filter @levelusp/runner setup:python`) ou com o perfil "runner" abaixo.
name: levelusp-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: levelusp_dev
      POSTGRES_USER: levelusp
      POSTGRES_PASSWORD: levelusp
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data, ./init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levelusp -d levelusp_dev"]
      interval: 3s
      retries: 20

  runner:
    profiles: ["runner"]
    build: { context: ../.., dockerfile: infra/docker/runner.Dockerfile }
    environment:
      # A imagem vem com NODE_ENV=production, que recusa o token de dev publicado abaixo.
      NODE_ENV: development
      RUNNER_TOKEN: dev-runner-token-0123456789abcdef
      # Motor python-dados ligado (a imagem traz o Pyodide); só o perfil dados fica quente.
      RUNNER_PYODIDE_ENABLED: ${RUNNER_PYODIDE_ENABLED:-true}
      RUNNER_PYODIDE_WARM: ${RUNNER_PYODIDE_WARM:-dados:1,ml:0}
      # `fresh` (um worker por lote), `reuse` (worker restaurado entre lotes) ou por perfil, como
      # em produção (`dados:fresh,ml:reuse`): para rodar `content:verify` em sequência a `reuse`
      # tira o aquecimento de cada lote (docs/v2/desempenho-executor.md); o compromisso de
      # isolamento dela está em docs/v2/motor-de-correcao.md e docs/v2/seguranca.md.
      RUNNER_PYODIDE_POLICY: ${RUNNER_PYODIDE_POLICY:-fresh}
      # Admissão por memória (mesmo valor do mem_limit abaixo): sem memória o lote espera ou
      # recebe 503, em vez de o contêiner morrer por OOM. 2g comporta um worker ml por vez.
      RUNNER_MEMORY: ${RUNNER_MEMORY:-2g}
      RUNNER_MEMORY_RESERVE_MB: ${RUNNER_MEMORY_RESERVE_MB:-512}
      RUNNER_BATCH_MEMORY_MB: ${RUNNER_BATCH_MEMORY_MB:-python:0,dados:256,ml:1229}
      # Motor python-completo desligado neste contêiner (ele não tem o binário nem o socket do
      # Docker). Para experimentar, rode o executor fora do contêiner: docs/v2/motores-e-ide.md §6.
      RUNNER_NATIVE_ENGINE: "off"
    ports: ["127.0.0.1:8081:8081"]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    # Um worker ml do Pyodide ocupa ≈ 1,2 GiB; para medir carga ml, suba RUNNER_MEMORY (ex.: 6g).
    mem_limit: ${RUNNER_MEMORY:-2g}

volumes:
  pgdata-dev:
