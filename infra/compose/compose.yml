# LevelUSP — pilha completa (homolog/prod). Um projeto compose por ambiente:
#   docker compose -p levelusp-homolog --env-file ../env/homolog.env -f compose.yml up -d
# As imagens vêm do GHCR (publicadas pelo CD). Nenhuma porta é exposta além do
# front em 127.0.0.1; o acesso público é feito pelo Cloudflare Tunnel.
name: levelusp

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: levelusp
      POSTGRES_USER: levelusp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${BACKUP_DIR:-./backups}:/backups
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levelusp -d levelusp"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${REGISTRY:-ghcr.io/lip3bazinga/levelusp}/api:${IMAGE_TAG:?defina IMAGE_TAG}
    command: ["node", "node_modules/@levelusp/db/dist/scripts/migrate.js"]
    environment:
      DATABASE_URL: postgres://levelusp:${POSTGRES_PASSWORD}@postgres:5432/levelusp
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    restart: "no"

  # Jobs sob demanda (perfil "tools"): docker compose --profile tools run --rm seed
  seed:
    image: ${REGISTRY:-ghcr.io/lip3bazinga/levelusp}/api:${IMAGE_TAG}
    command: ["node", "node_modules/@levelusp/db/dist/scripts/seed.js"]
    environment:
      DATABASE_URL: postgres://levelusp:${POSTGRES_PASSWORD}@postgres:5432/levelusp
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      SEED_CONTENT: ${SEED_CONTENT:-true}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [data]
    profiles: ["tools"]
    restart: "no"

  import-supabase:
    image: ${REGISTRY:-ghcr.io/lip3bazinga/levelusp}/api:${IMAGE_TAG}
    command: ["node", "node_modules/@levelusp/db/dist/scripts/import-supabase.js"]
    environment:
      DATABASE_URL: postgres://levelusp:${POSTGRES_PASSWORD}@postgres:5432/levelusp
      SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Precisa de internet para ler o Supabase: rede "app" além da "data".
    networks: [data, app]
    profiles: ["tools"]
    restart: "no"

  runner:
    <<: *restart
    image: ${REGISTRY:-ghcr.io/lip3bazinga/levelusp}/runner:${IMAGE_TAG}
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?defina RUNNER_TOKEN}
      # Uma execução por vCPU; a fila recusa (503 com Retry-After) só quando a espera estimada
      # passa de RUNNER_MAX_QUEUE_WAIT_MS. Medições: docs/v2/desempenho-e-carga.md.
      CONCURRENCY: ${RUNNER_CONCURRENCY:-2}
      MAX_QUEUE_WAIT_MS: ${RUNNER_MAX_QUEUE_WAIT_MS:-20000}
      # Motor python-dados (Pyodide): ligado por padrão (a imagem traz /opt/levelusp-pyodide).
      # Pool aquecido por perfil (dados = numpy+pandas; ml = + scipy/scikit-learn/matplotlib).
      # Política por perfil: dados em `fresh` (um worker novo por lote, isolamento mais forte) e
      # ml em `reuse` (worker restaurado entre lotes: tira ~9,5 s de aquecimento de cada envio).
      # O compromisso de isolamento da `reuse` está em docs/v2/motor-de-correcao.md.
      RUNNER_PYODIDE_ENABLED: ${RUNNER_PYODIDE_ENABLED:-true}
      RUNNER_PYODIDE_POLICY: ${RUNNER_PYODIDE_POLICY:-dados:fresh,ml:reuse}
      RUNNER_PYODIDE_WARM: ${RUNNER_PYODIDE_WARM:-dados:1,ml:0}
      RUNNER_PYODIDE_MAX_HEAP_MB: ${RUNNER_PYODIDE_MAX_HEAP_MB:-512}
      # Admissão por memória: o executor só inicia um lote quando o worker dele cabe em
      # RUNNER_MEMORY − RUNNER_MEMORY_RESERVE_MB (peso por perfil em RUNNER_BATCH_MEMORY_MB, MiB).
      # Sem memória o lote espera na fila ou recebe 503 com Retry-After; o contêiner não morre por
      # OOM. O perfil ml (≈ 1,2 GiB por worker) precisa de RUNNER_MEMORY ≥ 2g; abaixo disso as
      # lições ml são recusadas (as demais seguem funcionando).
      RUNNER_MEMORY: ${RUNNER_MEMORY:-2g}
      RUNNER_MEMORY_RESERVE_MB: ${RUNNER_MEMORY_RESERVE_MB:-512}
      RUNNER_BATCH_MEMORY_MB: ${RUNNER_BATCH_MEMORY_MB:-python:0,dados:256,ml:1229}
      # Motor python-completo (CPython nativo + PyTorch em contêiner gVisor): DESLIGADO, e fixo
      # aqui de propósito (não vem do .env). Ligar exige dar ao executor acesso a um daemon do
      # Docker, e o socket do Docker da máquina equivale a root nela. Este serviço NÃO monta o
      # socket; o desenho aceito para produção (máquina dedicada, Docker rootless + runsc) está
      # em docs/v2/seguranca.md, "Motor python-completo". Desligado, o runtime responde 501.
      RUNNER_NATIVE_ENGINE: "off"
    # Defesa em profundidade (além do sandbox WASI/Pyodide): sem rede externa, sistema de
    # arquivos somente leitura, sem privilégios, limites de CPU/memória/processos.
    networks: [runner]
    read_only: true
    tmpfs:
      # O perfil ml carrega ~1,3 GB no heap do wasm (fora do tmpfs); o tmpfs guarda só os
      # arquivos de projeto do WASI, por isso 256m basta.
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: ${RUNNER_MEMORY:-2g}
    cpus: ${RUNNER_CPUS:-2}

  api:
    <<: *restart
    image: ${REGISTRY:-ghcr.io/lip3bazinga/levelusp}/api:${IMAGE_TAG}
    environment:
      APP_ENV: ${APP_ENV:?defina APP_ENV}
      # Origem pública dos links (e-mail, certificado). Vazia → usa APP_ORIGIN (Quick Tunnel do notebook).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgres://levelusp:${POSTGRES_PASSWORD}@postgres:5432/levelusp
      RUNNER_URL: http://runner:8081
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-LevelUSP <nao-responda@levelusp.local>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      runner: { condition: service_healthy }
    networks: [data, runner, app]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    <<: *restart
    image: ${REGISTRY:-ghcr.io/lip3bazinga/levelusp}/web:${IMAGE_TAG}
    # Lidas em tempo de execução pelo SSR (não pelo build da imagem): ver apps/web/src/lib/config.
    environment:
      APP_ENV: ${APP_ENV}
      API_INTERNAL_URL: http://api:4000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      # Conexões ociosas abertas mais tempo que as do proxy na frente (cloudflared: 90 s;
      # Caddy: 120 s). Com o padrão de 5 s, um POST (ex.: Verificar) pode cair num socket que a
      # web acabou de fechar e o aluno vê 502.
      KEEP_ALIVE_TIMEOUT: ${WEB_KEEP_ALIVE_TIMEOUT_MS:-125000}
    depends_on:
      api: { condition: service_healthy }
    networks: [app]
    ports:
      # Só na máquina local (acesso direto para depuração); público via túnel.
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  tunnel:
    <<: *restart
    image: cloudflare/cloudflared:2025.9.1
    # Quick Tunnel: sem conta Cloudflare; o endereço muda a cada reinício.
    # Para endereço fixo, troque por: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:3000"]
    networks: [app]
    profiles: ["tunnel"]

networks:
  # internal: true = sem rota para a internet.
  data: { internal: true }
  runner: { internal: true }
  app: {}

volumes:
  pgdata:
  uploads:
